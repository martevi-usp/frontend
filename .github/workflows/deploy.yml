name: frontend deploy

# Deploys the static build to Cloudflare Workers after frontend CI passes on
# main, or on demand. The API URL is baked in at build time, so it comes from
# a repository variable. Setup: see the README's Deploy section.
on:
  workflow_run:
    workflows: ["frontend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI passed on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          # Without it the bundle silently falls back to http://localhost:8000.
          test -n "$VITE_API_URL" || { echo "Set the VITE_API_URL repository variable"; exit 1; }
          npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
